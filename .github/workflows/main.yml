name: Deploy Hugo Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 关键修改1：使用递归方式拉取子模块
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'   # 修改为recursive模式
          fetch-depth: 0

      # 新增步骤：显式更新子模块（双重保险）
      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: |
          rm -rf public
          hugo --minify --baseURL "https://celement.github.io/blog/" --environment production
          # 验证生成的HTML中是否有shortcode错误
          if grep -ri 'error' public; then exit 1; fi
        shell: bash

      - name: Validate Build Output
        run: |
          [ -f public/index.html ] || exit 1
          [ -d public/css ] || exit 1
          [ -f public/imgs/vendors/github.svg ] || exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: Celement/blog
          personal_token: ${{ secrets.ACTION_ACCESS_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions@github.com'
