name: Deploy Hugo Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Relative Paths
        run: |
          rm -rf public
          # 关键修改：无需指定baseURL参数，同时设置环境变量HUGO_RELATIVEURLS=true
          hugo --minify --environment production

      - name: Verify Relative Paths
        run: |
          echo "=== 检查图片路径 ==="
          # 确保图片路径是相对路径
          if grep -r 'src="/' public/; then
            echo "❌ 发现绝对路径，需要修复"
            exit 1
          fi
          echo "✅ 所有资源路径均为相对路径"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: Celement/blog
          personal_token: ${{ secrets.ACTION_ACCESS_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions@github.com'
